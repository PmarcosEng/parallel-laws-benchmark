# ============================================================
#  hardware.cfg  —  Configuracao de hardware do benchmark
#
#  Edite este arquivo manualmente antes de rodar o benchmark.
#  O programa le este arquivo obrigatoriamente ao iniciar;
#  se nao encontrar, exibe instrucoes e encerra.
# ============================================================

# ── CPU ──────────────────────────────────────────────────────
# cpu_nome     : Nome/modelo do processador (livre, aparece nos JSONs)
# cpu_nucleos  : Nucleos fisicos (ex: Ryzen 7 4800H = 8)
# cpu_threads  : Threads logicas com SMT/HyperThreading (ex: 16)
#                O benchmark testa threads: 1, 2, 4, 8, ..., cpu_threads
cpu_nome=r7
cpu_nucleos=8
cpu_threads=16

# ── GPU ──────────────────────────────────────────────────────
# gpu_nome       : Nome/modelo da GPU (livre, aparece nos JSONs)
# gpu_cuda_cores : Numero de CUDA cores — usado como thread count
#                  no modo gpu_sim (emulacao CPU) e nos kernels CUDA.
#                  GTX 1650 = 896   |   RTX 3060 = 3584   |   RTX 4090 = 16384
gpu_nome=GTX 1650
gpu_cuda_cores=896

# ── MEMORIA ──────────────────────────────────────────────────
# ram_gb : RAM livre para o benchmark (nao a total do sistema).
#          Aparece nos JSONs apenas como metadado informativo.
ram_gb=4

# ── REPETICOES ───────────────────────────────────────────────
# n_repeticoes : Numero de execucoes cronometradas por medicao.
#                Antes de cada medicao, 1 execucao de warmup e descartada.
#                A mediana das repeticoes e usada como tempo final.
#
#                Mais repeticoes = resultados mais estaveis, porem mais lentos.
#                Minimo: 1   |   Recomendado: 3 a 5   |   Maximo: 9
#
#                Exemplos de impacto no tempo total:
#                  n_repeticoes=1 : benchmark rapido (1 warmup + 1 run por medicao)
#                  n_repeticoes=3 : padrao estatisticamente confiavel
#                  n_repeticoes=5 : mais estavel, ~2x mais lento que =3
n_repeticoes=3

# ── VOLUMES DE BUSCA ─────────────────────────────────────────
# volumes_busca : Lista de volumes (numero de eventos) a testar,
#                 separados por virgula, em ordem crescente.
#
#                 Volumes canonicos sugeridos:
#                   1.000 | 100.000 | 1.000.000 | 10.000.000 | 20.000.000
#
#                 Cada evento ocupa ~96 bytes. Estimativa de RAM necessaria:
#                   100.000 ev  =   ~9 MB bruto  /  ~20 MB total (com copias)
#                 1.000.000 ev  =  ~92 MB bruto  / ~200 MB total
#                10.000.000 ev  = ~915 MB bruto  /  ~2 GB total
#                20.000.000 ev  =  ~1,8 GB bruto /  ~4 GB total
#
#                 ATENCAO: se o PC travar ou ficar sem RAM, remova os maiores
#                 volumes da lista e rode novamente.
#
#                 Sugestao por RAM livre:
#                   2 GB -> volumes_busca=1000,100000,1000000
#                   4 GB -> volumes_busca=1000,100000,1000000,10000000
#                   8 GB -> volumes_busca=1000,100000,1000000,10000000,20000000
volumes_busca=1000,100000,1000000,10000000

# ── VOLUMES DE MATEMATICA ────────────────────────────────────
# volumes_math : Lista de volumes (amostras Monte Carlo / pixels Mandelbrot)
#                a testar, separados por virgula, em ordem crescente.
#
#                Volumes canonicos sugeridos:
#                  100.000 | 500.000 | 1.000.000 | 5.000.000 | 10.000.000
#
#                Nao aloca arrays grandes — custo e puro compute.
#                Mesmo 10.000.000 e seguro em qualquer PC com >= 1 GB RAM.
#
#                Sugestao:
#                  Testes rapidos   -> volumes_math=100000,500000,1000000
#                  Testes completos -> volumes_math=100000,500000,1000000,5000000,10000000
volumes_math=100000,500000,1000000
